<!DOCTYPE html>
<!--
  TEMPLATE game-puzzle: a tile-merging puzzle on a grid. Pure rules (slide, move, canMove, spawn) are separate from drawing and input, so they
  can be tested without a browser. Swipe, arrow keys, WASD and on-screen buttons all call the same move(). Undo (5 steps), best score per
  board size, 3x3 to 6x6 boards, optional sound, reduced-motion support. Expose: window.game.
  To make a different puzzle keep the grid state, history and input plumbing and replace the rules in slide()/move() and the tile art in tileStyle().
-->
<html lang="__LANG__">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__TITLE__</title>
<meta name="theme-color" content="#f5f6f8">
<style>
  :root {
    --bg: #f5f6f8; --surface: #ffffff; --ink: #1b1f24; --muted: #5a626c; --line: #dde1e6; --accent: __ACCENT__; --accent-ink: #ffffff;
    --board: #cfd5dc; --cell: #e4e8ec; --radius: 14px; --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  }
  @media (prefers-color-scheme: dark) { :root { --bg: #111418; --surface: #1a1f25; --ink: #eceff3; --muted: #a0a9b4; --line: #2b323a; --board: #2b323a; --cell: #1f252c; } }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); display: grid; place-items: start center; padding: 14px 12px 28px; overscroll-behavior: contain; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
  main { width: min(100%, 520px); display: grid; gap: 12px; position: relative; }
  .head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
  h1 { margin: 0; font-size: 1.6rem; letter-spacing: -.02em; line-height: 1.1; }
  .lead { margin: 4px 0 0; color: var(--muted); font-size: .9rem; }
  .scores { display: flex; gap: 8px; }
  .score { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px; text-align: center; min-width: 76px; }
  .score span { display: block; color: var(--muted); font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; }
  .score b { font-size: 1.2rem; font-variant-numeric: tabular-nums; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .btn, select { min-height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: 600 .92rem var(--font); cursor: pointer; }
  .btn:hover, select:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn:disabled { opacity: .45; cursor: default; }
  label { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: .9rem; }
  #board { --n: 4; display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: 8px; padding: 8px; background: var(--board); border-radius: var(--radius); aspect-ratio: 1; touch-action: none; user-select: none; }
  .cell { background: var(--cell); border-radius: 10px; display: grid; place-items: center; min-width: 0; }
  .tile { width: 100%; height: 100%; border-radius: 10px; display: grid; place-items: center; font-weight: 800; font-variant-numeric: tabular-nums; font-size: calc(min(100vw, 520px) / (var(--n) * 3.1)); }
  .tile.long { font-size: calc(min(100vw, 520px) / (var(--n) * 4.4)); }
  .tile.pop { animation: pop .16s ease-out; } .tile.merge { animation: merge .2s ease-out; }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes merge { 50% { transform: scale(1.14); } }
  .pad { display: grid; grid-template-columns: repeat(3, 56px); grid-template-rows: repeat(2, 48px); gap: 6px; justify-content: center; }
  .pad .btn { padding: 0; font-size: 1.2rem; }
  .pad [data-dir="up"] { grid-column: 2; } .pad [data-dir="left"] { grid-column: 1; grid-row: 2; } .pad [data-dir="down"] { grid-column: 2; grid-row: 2; } .pad [data-dir="right"] { grid-column: 3; grid-row: 2; }
  #overlay { position: absolute; inset: 0; display: grid; place-content: center; gap: 10px; text-align: center; background: color-mix(in srgb, var(--bg) 88%, transparent); border-radius: var(--radius); z-index: 5; }
  #overlay[hidden] { display: none; }
  #overlay h2 { margin: 0; font-size: 1.6rem; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  @media (prefers-reduced-motion: reduce) { .tile.pop, .tile.merge { animation: none; } }
</style>
</head>
<body>
<main>
  <div class="head">
    <div><h1>__TITLE__</h1><p class="lead">Join equal tiles to reach <b id="target">2048</b>. Swipe or use the arrow keys.</p></div>
    <div class="scores"><div class="score"><span>Score</span><b id="score">0</b></div><div class="score"><span>Best</span><b id="best">0</b></div></div>
  </div>
  <div class="bar">
    <button class="btn primary" id="new" type="button">New game</button>
    <button class="btn" id="undo" type="button">Undo</button>
    <label for="size">Board <select id="size"><option value="3">3 x 3</option><option value="4" selected>4 x 4</option><option value="5">5 x 5</option><option value="6">6 x 6</option></select></label>
    <button class="btn" id="sound" type="button" aria-pressed="false">Sound off</button>
  </div>
  <div id="board" role="grid" aria-label="Game board"></div>
  <div class="pad" role="group" aria-label="Move buttons">
    <button class="btn" type="button" data-dir="up" aria-label="Move up">&uarr;</button>
    <button class="btn" type="button" data-dir="left" aria-label="Move left">&larr;</button>
    <button class="btn" type="button" data-dir="down" aria-label="Move down">&darr;</button>
    <button class="btn" type="button" data-dir="right" aria-label="Move right">&rarr;</button>
  </div>
  <p class="sr" id="live" role="status" aria-live="polite"></p>
  <div id="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title" hidden>
    <h2 id="ov-title"></h2><p id="ov-text"></p>
    <button class="btn primary" id="ov-btn" type="button">Play again</button>
  </div>
</main>

<script>
"use strict";
(() => {
  // ---------- EDIT: rules and look ----------
  const TARGETS = { 3: 256, 4: 2048, 5: 4096, 6: 8192 };
  const HUE = 168;                                         // base hue of the tile palette (matches the accent family)
  const HISTORY = 5;

  // ---------- pure rules ----------
  /** Slide one line toward index 0. Equal neighbours merge once per move. */
  function slide(row) {
    const tiles = row.filter(Boolean), out = [], merged = [];
    let gained = 0;
    for (let i = 0; i < tiles.length; i++) {
      if (tiles[i] === tiles[i + 1]) { out.push(tiles[i] * 2); gained += tiles[i] * 2; merged.push(out.length - 1); i++; }
      else out.push(tiles[i]);
    }
    while (out.length < row.length) out.push(0);
    return { row: out, gained, merged, moved: out.some((v, i) => v !== row[i]) };
  }
  /** Move the whole grid. dir: left | right | up | down. Returns a new grid, points gained and the indexes that merged. */
  function move(grid, dir) {
    const n = grid.length, next = grid.map((r) => r.slice()), merged = [];
    let gained = 0, moved = false;
    for (let k = 0; k < n; k++) {
      const coords = [];
      for (let j = 0; j < n; j++) coords.push(dir === "left" ? [k, j] : dir === "right" ? [k, n - 1 - j] : dir === "up" ? [j, k] : [n - 1 - j, k]);
      const res = slide(coords.map(([r, c]) => grid[r][c]));
      coords.forEach(([r, c], j) => { next[r][c] = res.row[j]; });
      res.merged.forEach((j) => merged.push(coords[j][0] * n + coords[j][1]));
      gained += res.gained; moved = moved || res.moved;
    }
    return { grid: next, gained, merged, moved };
  }
  function canMove(grid) {
    const n = grid.length;
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
      if (!grid[r][c] || (c + 1 < n && grid[r][c] === grid[r][c + 1]) || (r + 1 < n && grid[r][c] === grid[r + 1][c])) return true;
    }
    return false;
  }
  function spawn(grid, rand = Math.random) {
    const empty = [];
    grid.forEach((row, r) => row.forEach((v, c) => { if (!v) empty.push([r, c]); }));
    if (!empty.length) return -1;
    const [r, c] = empty[Math.floor(rand() * empty.length)];
    grid[r][c] = rand() < 0.9 ? 2 : 4;
    return r * grid.length + c;
  }

  // ---------- state ----------
  const G = { n: 4, grid: [], score: 0, best: 0, over: false, won: false, keepGoing: false, history: [], fresh: [], merged: [] };
  const $ = (id) => document.getElementById(id);
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, String(v)); } catch (e) { /* storage blocked */ } },
  };
  let soundOn = store.get("puzzle.sound") === "1", audio = null;

  function newGame(n) {
    if (n) G.n = n;
    G.grid = Array.from({ length: G.n }, () => Array(G.n).fill(0));
    G.score = 0; G.over = false; G.won = false; G.keepGoing = false; G.history = []; G.merged = [];
    G.best = Number(store.get("puzzle.best." + G.n)) || 0;
    G.fresh = [spawn(G.grid), spawn(G.grid)];
    hideOverlay(); render();
  }
  const count = () => G.grid.reduce((s, row) => s + row.filter(Boolean).length, 0);

  function play(dir) {
    if (G.over || (G.won && !G.keepGoing)) return false;
    const res = move(G.grid, dir);
    if (!res.moved) return false;
    G.history.push({ grid: G.grid.map((r) => r.slice()), score: G.score });
    if (G.history.length > HISTORY) G.history.shift();
    G.grid = res.grid; G.score += res.gained; G.merged = res.merged;
    G.fresh = [spawn(G.grid)];
    if (G.score > G.best) { G.best = G.score; store.set("puzzle.best." + G.n, G.best); }
    beep(res.merged.length ? 520 : 330);
    if (!G.keepGoing && Math.max(...G.grid.flat()) >= TARGETS[G.n]) { G.won = true; showOverlay("You reached " + TARGETS[G.n], "Score " + G.score + ". Keep going or start again.", "Keep going"); }
    else if (!canMove(G.grid)) { G.over = true; showOverlay("No moves left", "Final score " + G.score + (G.score >= G.best ? " (new best)" : "") + ".", "Play again"); }
    render();
    return true;
  }
  function undo() {
    if (G.won && !G.keepGoing) return false;
    const prev = G.history.pop();
    if (!prev) return false;
    G.grid = prev.grid; G.score = prev.score; G.over = false; G.fresh = []; G.merged = [];
    hideOverlay(); render();
    return true;
  }

  // ---------- drawing ----------
  function tileStyle(v) {
    const e = Math.log2(v), h = (HUE + e * 22) % 360, l = Math.max(30, 90 - e * 5.5), bg = "hsl(" + h.toFixed(0) + " 48% " + l.toFixed(0) + "%)";
    return "background:" + bg + ";color:" + inkFor(h, 0.48, l / 100);
  }
  function inkFor(h, s, l) {                               // pick white or near-black text, whichever contrasts more
    const a = s * Math.min(l, 1 - l), f = (n) => { const k = (n + h / 30) % 12; return l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)); };
    const lin = (c) => (c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4)), L = 0.2126 * lin(f(0)) + 0.7152 * lin(f(8)) + 0.0722 * lin(f(4));
    return (1.05 / (L + 0.05)) >= ((L + 0.05) / 0.0634) ? "#ffffff" : "#1b1f24";
  }
  function render() {
    const board = $("board");
    board.setAttribute("style", "--n:" + G.n);
    board.innerHTML = G.grid.map((row, r) => row.map((v, c) => {
      const idx = r * G.n + c, cls = "tile" + (G.fresh.includes(idx) ? " pop" : G.merged.includes(idx) ? " merge" : "") + (String(v).length > 3 ? " long" : "");
      return '<div class="cell" role="gridcell" aria-label="Row ' + (r + 1) + ", column " + (c + 1) + ": " + (v || "empty") + '">' + (v ? '<div class="' + cls + '" style="' + tileStyle(v) + '">' + v + "</div>" : "") + "</div>";
    }).join("")).join("");
    $("score").textContent = G.score; $("best").textContent = G.best; $("target").textContent = TARGETS[G.n];
    $("undo").disabled = !G.history.length;
    $("live").textContent = "Score " + G.score;
  }
  function showOverlay(title, text, button) { $("ov-title").textContent = title; $("ov-text").textContent = text; $("ov-btn").textContent = button; $("ov-btn").dataset.mode = G.over ? "new" : "continue"; $("overlay").hidden = false; }
  function hideOverlay() { $("overlay").hidden = true; }
  function beep(freq) {
    if (!soundOn) return;
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      const o = audio.createOscillator(), g = audio.createGain();
      o.frequency.value = freq; g.gain.value = 0.04; o.connect(g); g.connect(audio.destination); o.start(); o.stop(audio.currentTime + 0.06);
    } catch (e) { /* no audio available */ }
  }

  // ---------- input ----------
  const KEYS = { ArrowLeft: "left", ArrowRight: "right", ArrowUp: "up", ArrowDown: "down", a: "left", d: "right", w: "up", s: "down" };
  window.addEventListener("keydown", (e) => {
    const t = e.target && e.target.tagName;
    if (t === "SELECT" || t === "INPUT") return;
    if (KEYS[e.key]) { if (e.preventDefault) e.preventDefault(); play(KEYS[e.key]); }
    else if (e.key === "z" || e.key === "Z") undo();
  });
  let start = null;
  $("board").addEventListener("pointerdown", (e) => { start = { x: e.clientX, y: e.clientY }; });
  $("board").addEventListener("pointerup", (e) => {
    if (!start) return;
    const dx = e.clientX - start.x, dy = e.clientY - start.y;
    start = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    play(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"));
  });
  $("board").addEventListener("pointercancel", () => { start = null; });
  document.querySelectorAll("[data-dir]").forEach((b) => b.addEventListener("click", () => play(b.dataset.dir)));
  $("new").addEventListener("click", () => newGame());
  $("undo").addEventListener("click", undo);
  $("size").addEventListener("change", (e) => newGame(Number(e.target.value)));
  $("ov-btn").addEventListener("click", () => { if ($("ov-btn").dataset.mode === "continue") { G.keepGoing = true; hideOverlay(); } else newGame(); });
  $("sound").addEventListener("click", () => {
    soundOn = !soundOn; store.set("puzzle.sound", soundOn ? "1" : "0");
    $("sound").textContent = soundOn ? "Sound on" : "Sound off"; $("sound").setAttribute("aria-pressed", String(soundOn));
  });
  $("sound").textContent = soundOn ? "Sound on" : "Sound off"; $("sound").setAttribute("aria-pressed", String(soundOn));

  window.game = { G, slide, move, canMove, spawn, newGame, play, undo, count };
  newGame();
})();
</script>
</body>
</html>
