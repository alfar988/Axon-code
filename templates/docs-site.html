<!DOCTYPE html>
<!--
  TEMPLATE docs-site: a single-file documentation or knowledge-base site. Pages are plain markdown strings in the DOCS array; the file
  renders them with a small, safe markdown renderer (text is escaped first), builds the sidebar and a table of contents, highlights the
  heading in view, searches titles and bodies, routes with the URL hash (#/page-id), copies code blocks, and supports light and dark themes.
  To use it: replace the entries in DOCS (id, section, title, body). Everything else adapts by itself. Edit the places marked EDIT.
-->
<html lang="__LANG__">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__TITLE__</title>
<meta name="theme-color" content="#f5f6f8">
<style>
  :root {
    --bg: #f5f6f8; --surface: #ffffff; --ink: #1b1f24; --muted: #5a626c; --line: #dde1e6; --accent: __ACCENT__; --accent-ink: #ffffff;
    --code: #eef0f3; --radius: 12px; --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #111418; --surface: #1a1f25; --ink: #eceff3; --muted: #a0a9b4; --line: #2b323a; --code: #12161b; } }
  :root[data-theme="dark"] { --bg: #111418; --surface: #1a1f25; --ink: #eceff3; --muted: #a0a9b4; --line: #2b323a; --code: #12161b; }
  *, *::before, *::after { box-sizing: border-box; }
  html { scroll-padding-top: 76px; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); line-height: 1.65; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  a { color: var(--accent); }
  .top { position: sticky; top: 0; z-index: 20; display: flex; gap: 10px; align-items: center; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
  .brand { font-weight: 800; letter-spacing: -.02em; margin-right: auto; }
  .btn { min-height: 44px; min-width: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: var(--ink); font: 600 .92rem var(--font); cursor: pointer; }
  .btn:hover { border-color: var(--accent); }
  .search { position: relative; flex: 1 1 220px; max-width: 360px; }
  .search input { width: 100%; min-height: 44px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: inherit; font: inherit; padding: 0 12px; }
  #results { position: absolute; left: 0; right: 0; top: 50px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 6px; margin: 0; list-style: none; box-shadow: 0 10px 30px rgba(0,0,0,.18); max-height: 60vh; overflow: auto; }
  #results[hidden] { display: none; }
  #results a { display: block; padding: 8px 10px; border-radius: 8px; text-decoration: none; color: var(--ink); }
  #results a small { display: block; color: var(--muted); }
  #results a[aria-selected="true"], #results a:hover { background: var(--bg); }
  .layout { display: grid; grid-template-columns: 1fr; width: min(100%, 1180px); margin-inline: auto; }
  @media (min-width: 900px) { .layout { grid-template-columns: 250px minmax(0, 1fr); } }
  @media (min-width: 1200px) { .layout { grid-template-columns: 250px minmax(0, 1fr) 210px; } }
  nav.side { padding: 18px 16px; }
  @media (max-width: 899px) { nav.side { display: none; position: fixed; inset: 64px 0 0 0; z-index: 15; background: var(--surface); overflow: auto; } nav.side.open { display: block; } #menu { display: inline-block; } }
  @media (min-width: 900px) { #menu { display: none; } nav.side { position: sticky; top: 64px; align-self: start; max-height: calc(100vh - 64px); overflow: auto; } }
  nav.side h2 { font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 18px 0 6px; }
  nav.side a { display: flex; align-items: center; min-height: 40px; padding: 0 10px; border-radius: 8px; color: var(--ink); text-decoration: none; }
  nav.side a:hover { background: var(--surface); }
  nav.side a[aria-current="page"] { background: var(--accent); color: var(--accent-ink); font-weight: 650; }
  main { padding: 28px 18px 80px; min-width: 0; }
  main h1 { font-size: 2rem; letter-spacing: -.02em; line-height: 1.2; margin: 0 0 8px; }
  main h2 { font-size: 1.4rem; margin: 2em 0 .5em; letter-spacing: -.01em; }
  main h3 { font-size: 1.1rem; margin: 1.6em 0 .4em; }
  main p, main li { max-width: 70ch; }
  main code { font-family: var(--mono); font-size: .88em; background: var(--code); padding: 1px 6px; border-radius: 6px; }
  .codeblock { position: relative; margin: 1em 0; }
  .codeblock pre { margin: 0; padding: 14px 16px; overflow-x: auto; background: var(--code); border: 1px solid var(--line); border-radius: var(--radius); font-size: .88rem; line-height: 1.5; }
  .codeblock pre code { background: none; padding: 0; font-size: inherit; }
  .copy { position: absolute; top: 8px; right: 8px; min-height: 36px; padding: 0 10px; font-size: .8rem; }
  blockquote { margin: 1em 0; padding: 4px 16px; border-left: 4px solid var(--accent); background: var(--surface); border-radius: 0 8px 8px 0; }
  .pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 48px; }
  .pager a { flex: 1; padding: 12px 16px; border: 1px solid var(--line); border-radius: var(--radius); text-decoration: none; color: var(--ink); background: var(--surface); }
  .pager a small { display: block; color: var(--muted); }
  .pager a:hover { border-color: var(--accent); }
  aside.toc { display: none; }
  @media (min-width: 1200px) { aside.toc { display: block; position: sticky; top: 64px; align-self: start; padding: 28px 8px; font-size: .88rem; } }
  aside.toc h2 { font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
  aside.toc a { display: block; padding: 4px 8px; color: var(--muted); text-decoration: none; border-left: 2px solid var(--line); }
  aside.toc a.sub { padding-left: 20px; }
  aside.toc a[aria-current="true"] { color: var(--accent); border-left-color: var(--accent); font-weight: 650; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  @media print { .top, nav.side, aside.toc, .pager, .copy { display: none !important; } }
</style>
</head>
<body>
<header class="top">
  <button class="btn" id="menu" type="button" aria-expanded="false" aria-controls="side">Menu</button>
  <a class="brand" href="#/" style="color:inherit;text-decoration:none">__TITLE__</a>
  <div class="search">
    <label class="sr" for="q">Search the documentation</label>
    <input id="q" type="search" placeholder="Search ( / )" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="results">
    <ul id="results" role="listbox" hidden></ul>
  </div>
  <button class="btn" id="theme" type="button" aria-label="Switch between light and dark theme">Theme</button>
</header>
<div class="layout">
  <nav class="side" id="side" aria-label="Documentation"></nav>
  <main id="main" tabindex="-1"><h1>__TITLE__</h1><p>Loading the documentation. This site needs JavaScript.</p></main>
  <aside class="toc" aria-label="On this page"><h2>On this page</h2><div id="toc"></div></aside>
</div>
<p class="sr" id="live" role="status" aria-live="polite"></p>

<script>
"use strict";
(() => {
  // ---------- EDIT: the content. One entry per page; body is markdown (headings, lists, **bold**, *em*, `code`, [links](url), fenced code, > quotes). ----------
  const DOCS = [
    { id: "start", section: "Guide", title: "Getting started", body: "Welcome. This page shows how the documentation is organised and how to add your own.\n\n## What you need\n\n- A modern browser\n- A text editor\n- About five minutes\n\n## Add a page\n\nEach page is an object in the `DOCS` array:\n\n```js\n{ id: \"my-page\", section: \"Guide\", title: \"My page\", body: \"## Heading\\n\\nText.\" }\n```\n\nThe sidebar, search index and table of contents are built from these objects.\n\n> Keep page ids short and lower case: they become the URL, for example `#/my-page`." },
    { id: "install", section: "Guide", title: "Installation", body: "## Install\n\nRun the installer for your platform:\n\n```bash\nnpm install your-package\n```\n\n## Check the version\n\n```bash\nyour-package --version\n```\n\nIf the command is not found, restart the terminal so the new `PATH` is loaded." },
    { id: "config", section: "Guide", title: "Configuration", body: "## Options\n\n1. `port`: the port to listen on, default `8000`\n2. `debug`: print extra logs, default `false`\n3. `data`: folder for stored files\n\n## Example\n\n```json\n{ \"port\": 8080, \"debug\": true, \"data\": \"./data\" }\n```\n\n### Environment variables\n\nEvery option can also be set as `APP_PORT`, `APP_DEBUG` or `APP_DATA`. Environment variables win over the file." },
    { id: "api", section: "Reference", title: "API reference", body: "## `connect(options)`\n\nOpens a connection and returns a client.\n\n```js\nconst client = await connect({ port: 8080 });\n```\n\n## `client.get(key)`\n\nReturns the stored value, or `null` when the key does not exist.\n\n## `client.set(key, value)`\n\nStores a value. Returns `true` on success.\n\n### Errors\n\nAll methods throw an `Error` with a `code` property: `ECONN` for connection problems and `EARG` for invalid arguments." },
    { id: "trouble", section: "Reference", title: "Troubleshooting", body: "## Port already in use\n\nAnother program is using the port. Choose a different `port` in the configuration or stop the other program.\n\n## Permission denied\n\nThe `data` folder must be writable by the user running the program.\n\n## Still stuck?\n\nOpen an issue with the exact error text and the output of `your-package --version`." },
  ];

  // ---------- helpers ----------
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const slug = (s) => String(s).toLowerCase().replace(/<[^>]*>/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") || "section";
  const safeUrl = (u) => (/^(https?:\/\/|\/|#|\.\.?\/|mailto:)/i.test(u) ? u : "#");

  /** Markdown subset to HTML. Input is escaped FIRST, so page text can never inject markup. Returns {html, toc}. */
  function md(src) {
    const lines = String(src).replace(/\r\n?/g, "\n").split("\n"), out = [], toc = [], used = {};
    const inline = (t) => esc(t)
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>")
      .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, text, url) => '<a href="' + esc(safeUrl(url.replace(/&amp;/g, "&"))) + '"' + (/^https?:/i.test(url) ? ' rel="noopener noreferrer"' : "") + ">" + text + "</a>");
    let i = 0;
    while (i < lines.length) {
      const line = lines[i];
      let m;
      if ((m = /^```\s*(\w+)?\s*$/.exec(line))) {
        const code = [];
        for (i++; i < lines.length && !/^```\s*$/.test(lines[i]); i++) code.push(lines[i]);
        i++;
        out.push('<div class="codeblock"><button class="btn copy" type="button" data-copy>Copy</button><pre><code>' + esc(code.join("\n")) + "</code></pre></div>");
      } else if ((m = /^(#{2,3})\s+(.+)$/.exec(line))) {
        let id = slug(m[2]); used[id] = (used[id] || 0) + 1; if (used[id] > 1) id += "-" + used[id];
        toc.push({ id, level: m[1].length, text: m[2].replace(/`/g, "") });
        out.push("<h" + m[1].length + ' id="' + id + '">' + inline(m[2]) + "</h" + m[1].length + ">"); i++;
      } else if (/^\s*[-*]\s+/.test(line) || /^\s*\d+\.\s+/.test(line)) {
        const ordered = /^\s*\d+\./.test(line), items = [];
        for (; i < lines.length && (ordered ? /^\s*\d+\.\s+/ : /^\s*[-*]\s+/).test(lines[i]); i++) items.push("<li>" + inline(lines[i].replace(/^\s*(\d+\.|[-*])\s+/, "")) + "</li>");
        out.push((ordered ? "<ol>" : "<ul>") + items.join("") + (ordered ? "</ol>" : "</ul>"));
      } else if (/^>\s?/.test(line)) {
        const q = [];
        for (; i < lines.length && /^>\s?/.test(lines[i]); i++) q.push(lines[i].replace(/^>\s?/, ""));
        out.push("<blockquote><p>" + inline(q.join(" ")) + "</p></blockquote>");
      } else if (!line.trim()) { i++; }
      else {
        const p = [];
        for (; i < lines.length && lines[i].trim() && !/^(```|#{2,3}\s|>\s?|\s*[-*]\s+|\s*\d+\.\s+)/.test(lines[i]); i++) p.push(lines[i]);
        out.push("<p>" + inline(p.join(" ")) + "</p>");
      }
    }
    return { html: out.join("\n"), toc };
  }

  // ---------- search: title 6, heading 3, body 1 per word hit ----------
  const words = (q) => String(q).toLowerCase().split(/[^a-z0-9]+/).filter((w) => w.length > 1);
  function search(q) {
    const ws = words(q);
    if (!ws.length) return [];
    return DOCS.map((d) => {
      const title = d.title.toLowerCase(), body = d.body.toLowerCase(), heads = (d.body.match(/^#{2,3} .+$/gm) || []).join(" ").toLowerCase();
      let score = 0;
      for (const w of ws) {
        if (title.includes(w)) score += 6;
        if (heads.includes(w)) score += 3;
        if (body.includes(w)) score += 1;
      }
      const at = body.indexOf(ws[0]);
      return { doc: d, score, snippet: at >= 0 ? d.body.slice(Math.max(0, at - 30), at + 80).replace(/[#`*>\n]+/g, " ").trim() : "" };
    }).filter((r) => r.score > 0).sort((a, b) => b.score - a.score).slice(0, 8);
  }

  // ---------- render ----------
  let current = DOCS[0].id, spy = null;
  const pageId = () => { const m = /^#\/([\w-]+)/.exec(location.hash || ""); return m && DOCS.some((d) => d.id === m[1]) ? m[1] : DOCS[0].id; };

  function renderNav() {
    let html = "", last = "";
    DOCS.forEach((d) => {
      if (d.section !== last) { html += "<h2>" + esc(d.section) + "</h2>"; last = d.section; }
      html += '<a href="#/' + d.id + '"' + (d.id === current ? ' aria-current="page"' : "") + ">" + esc(d.title) + "</a>";
    });
    $("side").innerHTML = html;
  }
  function renderPage() {
    current = pageId();
    const idx = DOCS.findIndex((d) => d.id === current), doc = DOCS[idx], r = md(doc.body);
    const prev = DOCS[idx - 1], next = DOCS[idx + 1];
    $("main").innerHTML = "<h1>" + esc(doc.title) + "</h1>" + r.html + '<div class="pager">'
      + (prev ? '<a href="#/' + prev.id + '"><small>Previous</small>' + esc(prev.title) + "</a>" : "<span></span>")
      + (next ? '<a href="#/' + next.id + '" style="text-align:right"><small>Next</small>' + esc(next.title) + "</a>" : "") + "</div>";
    $("toc").innerHTML = r.toc.map((t) => '<a href="#/' + current + "/" + t.id + '" data-id="' + t.id + '" class="' + (t.level === 3 ? "sub" : "") + '">' + esc(t.text) + "</a>").join("");
    document.title = doc.title + " | __TITLE__";
    $("live").textContent = doc.title;
    renderNav();
    observe();
    $("side").classList && $("side").classList.remove("open");
    $("menu").setAttribute("aria-expanded", "false");
    const m = /^#\/[\w-]+\/([\w-]+)/.exec(location.hash || "");
    const target = m && document.getElementById(m[1]);
    if (target && target.scrollIntoView) target.scrollIntoView(); else if (window.scrollTo) window.scrollTo(0, 0);
  }
  function observe() {
    if (spy && spy.disconnect) spy.disconnect();
    const links = {};
    ($("toc").querySelectorAll ? Array.from($("toc").querySelectorAll("a")) : []).forEach((a) => { links[a.dataset.id] = a; });
    if (!("IntersectionObserver" in window) && typeof IntersectionObserver === "undefined") return;
    spy = new IntersectionObserver((entries) => {
      entries.forEach((e) => { if (e.isIntersecting && links[e.target.id]) { Object.values(links).forEach((a) => a.removeAttribute("aria-current")); links[e.target.id].setAttribute("aria-current", "true"); } });
    }, { rootMargin: "-70px 0px -70% 0px" });
    Object.keys(links).forEach((id) => { const h = document.getElementById(id); if (h) spy.observe(h); });
  }

  // ---------- search UI ----------
  let hits = [], active = -1;
  function showResults(q) {
    hits = search(q); active = -1;
    const box = $("results");
    box.innerHTML = hits.length ? hits.map((h, n) => '<li role="presentation"><a role="option" id="r' + n + '" href="#/' + h.doc.id + '">' + esc(h.doc.title) + "<small>" + esc(h.snippet) + "</small></a></li>").join("")
      : (q.trim() ? '<li role="presentation"><a role="option" href="#/' + current + '">No results for "' + esc(q.trim()) + '"</a></li>' : "");
    box.hidden = !q.trim();
    $("q").setAttribute("aria-expanded", String(!box.hidden));
  }
  function pick(n) {
    active = (n + hits.length) % Math.max(1, hits.length);
    hits.forEach((h, i) => { const el = document.getElementById("r" + i); if (el) el.setAttribute("aria-selected", String(i === active)); });
  }
  $("q").addEventListener("input", (e) => showResults(e.target.value));
  $("q").addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown") { e.preventDefault(); pick(active + 1); }
    else if (e.key === "ArrowUp") { e.preventDefault(); pick(active - 1); }
    else if (e.key === "Enter" && hits[Math.max(active, 0)]) { location.hash = "#/" + hits[Math.max(active, 0)].doc.id; $("results").hidden = true; $("q").value = ""; }
    else if (e.key === "Escape") { $("results").hidden = true; }
  });
  $("results").addEventListener("click", () => { $("results").hidden = true; $("q").value = ""; });
  window.addEventListener("keydown", (e) => {
    const t = e.target && e.target.tagName;
    if (e.key === "/" && t !== "INPUT" && t !== "TEXTAREA") { e.preventDefault(); $("q").focus(); }
  });

  // ---------- menu, theme, copy ----------
  $("menu").addEventListener("click", () => { const open = $("side").classList.toggle("open"); $("menu").setAttribute("aria-expanded", String(Boolean(open))); });
  function applyTheme(t) { if (t) document.documentElement.setAttribute("data-theme", t); }
  try { applyTheme(localStorage.getItem("docs.theme")); } catch (e) { /* storage blocked */ }
  $("theme").addEventListener("click", () => {
    const dark = document.documentElement.getAttribute("data-theme") === "dark" || (!document.documentElement.getAttribute("data-theme") && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
    const next = dark ? "light" : "dark";
    applyTheme(next);
    try { localStorage.setItem("docs.theme", next); } catch (e) { /* ignore */ }
  });
  $("main").addEventListener("click", (e) => {
    const b = e.target.closest && e.target.closest("[data-copy]");
    if (!b) return;
    const code = b.parentNode.querySelector("code"), text = code ? code.textContent : "";
    const done = () => { b.textContent = "Copied"; setTimeout(() => { b.textContent = "Copy"; }, 1500); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, () => { b.textContent = "Press Ctrl+C"; });
    else b.textContent = "Select and copy";
  });

  window.addEventListener("hashchange", renderPage);
  window.app = { DOCS, md, search, go: (id) => { location.hash = "#/" + id; renderPage(); }, renderPage };
  renderPage();
})();
</script>
</body>
</html>
